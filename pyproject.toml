[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendmodel"
version = "0.2.0"
description = "A lightweight, explainable Task IR tagger for model routing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trendmodel = "trendmodel.cli:main"

[tool.setuptools.packages.find]
include = ["trendmodel*"]
